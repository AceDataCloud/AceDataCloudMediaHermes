name: Validate Hermes plugin
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        hermes:
          - version: '0.21.6'
            sha: '818c13be1dc4fd28987e1e881a9408224afd4535'
          - version: '0.21.7'
            sha: '71d34bad1045610252eda02ee79549436896e784'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Unit contracts (no paid requests)
        run: python3 -m unittest discover -s tests -v
      - uses: NousResearch/hermes-agent/.github/actions/plugin-validate@71d34bad1045610252eda02ee79549436896e784
        with:
          path: ${{ github.workspace }}
          hermes-ref: ${{ matrix.hermes.sha }}
      - name: Verify single-plugin service selection and host isolation
        shell: bash
        run: |
          set -euo pipefail
          hermes_source=("$RUNNER_TEMP"/hermes-plugin-validator.*)
          export HERMES_SOURCE="${hermes_source[0]}"
          export PYTHONPATH="$HERMES_SOURCE"
          "$HERMES_SOURCE/.build/validator/bin/python" -m unittest discover -s tests -v
          "$HERMES_SOURCE/.build/validator/bin/python" -m hermes_cli.main plugins validate "$GITHUB_WORKSPACE" --install-deps
          "$HERMES_SOURCE/.build/validator/bin/python" scripts/check_runtime.py
      - name: Verify published catalog installation
        if: github.event_name == 'workflow_dispatch'
        env:
          HERMES_EXPECTED_SHA: ${{ matrix.hermes.sha }}
        shell: bash
        run: |
          set -euo pipefail
          hermes_source=("$RUNNER_TEMP"/hermes-plugin-validator.*)
          export HERMES_SOURCE="${hermes_source[0]}"
          "$HERMES_SOURCE/.build/validator/bin/python" scripts/check_published_catalog.py
