{
  "name": "acedatacloud-media",
  "version": "2.0.1",
  "description": "17 Ace Data Cloud service toolsets and a Nano Banana image_generate backend. Each generate call spends Ace Data Cloud credits on your ACEDATACLOUD_API_KEY with no Hermes approval prompt; the model can choose costly options (pro models, 4K, up to 4 images), and prompts and reference URLs go to api.acedata.cloud. Google Search and face analysis also spend Credits.",
  "author": "AceDataCloud",
  "requires_hermes": ">=0.21.6",
  "provides_tools": [
    "acedatacloud_nano_banana_generate",
    "acedatacloud_nano_banana_task",
    "acedatacloud_veo_generate",
    "acedatacloud_veo_task",
    "acedatacloud_suno_generate",
    "acedatacloud_suno_task",
    "acedatacloud_fish_generate",
    "acedatacloud_fish_task",
    "acedatacloud_gpt_image_generate",
    "acedatacloud_gpt_image_task",
    "acedatacloud_seedance_generate",
    "acedatacloud_seedance_task",
    "acedatacloud_seedream_generate",
    "acedatacloud_seedream_task",
    "acedatacloud_happyhorse_generate",
    "acedatacloud_happyhorse_task",
    "acedatacloud_qwen_image_generate",
    "acedatacloud_qwen_image_task",
    "acedatacloud_google_search_search",
    "acedatacloud_grok_generate",
    "acedatacloud_grok_task",
    "acedatacloud_face_analyze",
    "acedatacloud_midjourney_generate",
    "acedatacloud_midjourney_task",
    "acedatacloud_flux_generate",
    "acedatacloud_flux_task",
    "acedatacloud_minimax_generate",
    "acedatacloud_minimax_task",
    "acedatacloud_wan_generate",
    "acedatacloud_wan_task",
    "acedatacloud_kling_generate",
    "acedatacloud_kling_task"
  ],
  "requires_env": [
    "ACEDATACLOUD_API_KEY"
  ]
}
